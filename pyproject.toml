[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-latest-check"
version = "0.1.0"
description = "Find GitHub Actions jobs on ubuntu-latest that install apt packages or Python versions Ubuntu 26.04 no longer provides"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jonathan Wrede" }]
dependencies = ["PyYAML>=5.1"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Jwrede/ubuntu-latest-check"

[project.scripts]
ubuntu-latest-check = "ubuntu_latest_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
